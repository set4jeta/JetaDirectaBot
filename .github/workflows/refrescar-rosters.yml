# Refresca los rosters de dpm.lol y publica el censo en la rama `estado`.
#
# Por qué existe este fichero
# ---------------------------
# Los rosters salen de dpm.lol, y desde el 01-11-2026 Cloudflare contesta **403
# a la IP de Render**. No es un fallo del cliente ni del scraper: se probó con
# cloudscraper y con curl_cffi (huella TLS de Chrome) y los dos dan 403 desde el
# datacenter, mientras que desde una IP doméstica los dos pasan. Es reputación de
# IP, y la IP de salida de Render no se puede cambiar.
#
# El síntoma era mudo: `accounts_from_teams.json` no llegaba a crearse, el bot
# seguía «encendido» (`/health` en 200) y no avisaba de nada.
#
# Este workflow hace el scraping **desde un runner de GitHub**, que sale por otra
# IP, y deja el resultado en la rama `estado`. El bot se lo baja cada pocas horas
# (`sincronizar_censo_remoto` en `core/background_tasks.py`).
#
# Ojo: desde el 01-11-2026 esto ya **no** es la vía principal. El relay de
# `infra/relay-dpm/` (un Worker de Cloudflare) sí entra en dpm.lol desde Render, y
# con él el bot vuelve a refrescar rosters y leaderboards él solo. Este workflow
# se queda para lo que el bot no puede hacer: mantener el censo al día **mientras
# el bot está dormido**, que en el plan gratuito de Render pasa a menudo.
#
# Qué publica
# -----------
# Solo `tracking/soloq/censo_compacto.json` (ver `estado_remoto.CENSO`). El censo
# grande son 1,7 MB y la API de contenidos de GitHub no está cómoda ahí; la copia
# compacta son ~290 KB y lleva PUUID y plataforma de cada cuenta, que es lo que
# el barrido necesita. El resto de la rama **no** se toca: `egress.json` y
# `notified_games.json` son contadores vivos del bot y una copia de hace horas
# los haría retroceder.
#
# Secretos necesarios
# -------------------
#   · El `GITHUB_TOKEN` es el de serie; basta con `contents: write`, que se pide
#     abajo. No hay que configurar nada.
#   · `RIOT_API_KEY` es **opcional** y se añade en Settings → Secrets and
#     variables → Actions. Con ella, las cuentas nuevas salen publicadas con su
#     PUUID en la misma pasada. Sin ella, el script lo avisa y publica las
#     cuentas sin PUUID: el bot las repara él solo cada 6 h
#     (`actualizar_puuids_periodico` → `_reparar_desde_el_censo`), porque la API
#     de Riot **no** está bloqueada desde Render — lo que está bloqueado es
#     dpm.lol. O sea que sin el secreto funciona, solo que con unas horas de
#     retraso en los fichajes.
#   · `DPM_RELAY_SECRET` es **opcional pero muy recomendable**, y también se
#     añade en Settings → Secrets and variables → Actions. Con él, el scraping
#     sale por el Worker de Cloudflare y funciona **a la primera**, sin depender
#     de que la IP del runner tenga buena reputación. Sin él, el relay contesta
#     `forbidden` y el script cae a `curl_cffi`, o sea a la lotería de siempre.
#     La clave no va escrita aquí porque el repo es **público**.
name: Refrescar rosters

on:
  schedule:
    # Cada hora, a un minuto que no es el de nadie.
    #
    # No es por prisa: es que la IP del runner es una lotería y hay que echar
    # muchos números. Medido el 01-11-2026: de nueve ejecuciones seguidas del
    # mismo código, **una** pasó (con ~16 % de peticiones rechazadas y
    # reintentadas) y ocho se comieron un 403 desde la primera petición. Con tres
    # intentos por vuelta y 24 vueltas al día son 72 IPs distintas diarias: que
    # ninguna sirva es del orden de una entre un millón.
    #
    # Cuesta cero: el repo es público y GitHub no cobra minutos en repos
    # públicos. Y cuando la IP sí sirve, la vuelta dura un minuto y las
    # siguientes se saltan por el freno de abajo.
    #
    # El freno de `--si-mas-de-minutos 50` evita que las vueltas siguientes
    # repitan el scraping cuando una ya publicó, y por eso tiene que ser **menor**
    # que el intervalo del cron.
    - cron: '17 * * * *'
  # Al tocar el scraper o el script, se prueba solo. Es la única forma de saber
  # si un cambio en el scraping sigue funcionando **desde la IP del runner**, que
  # es justo la que no se puede reproducir en local.
  push:
    branches: [main]
    paths:
      - 'scripts/refrescar_rosters.py'
      - 'apis/transporte_dpm.py'
      - 'tracking/soloq/accounts_from_teams.py'
      - 'tracking/soloq/censo.py'
      - '.github/workflows/refrescar-rosters.yml'
  # Para probarlo a mano desde la pestaña Actions sin esperar al cron.
  workflow_dispatch:
    inputs:
      ligas:
        description: 'Ligas a refrescar, separadas por comas (vacío = todas)'
        required: false
        default: ''

permissions:
  contents: write

# Si alguien lanza dos a la vez, el segundo espera: los dos escribirían el mismo
# fichero de la misma rama y el `sha` del remoto se pisaría.
concurrency:
  group: rosters
  cancel-in-progress: false

jobs:
  rosters:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Tres intentos **en serie**, cada uno en un runner distinto.
    #
    # No es por si el scraping falla por un detalle: es que la reputación de la
    # IP de un runner cambia de una ejecución a otra. Medido el 01-11-2026 con
    # dos runs seguidos del mismo código: el primero pasó con ~16 % de peticiones
    # rechazadas (reintentadas y servidas), el segundo recibió 403 en todo desde
    # la primera petición, leaderboard incluido. Dentro de una ejecución la IP no
    # cambia, así que la única forma de reintentar es otra ejecución.
    #
    # El segundo y el tercero no repiten trabajo: `--si-mas-de-minutos 5` los deja
    # salir con 0 si el censo de la rama se publicó hace un momento (por el
    # intento anterior de este mismo run).
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        intento: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      # Se instala solo lo que usa este script, no `requirements.txt` entero:
      # el bot arrastra nextcord, twitchio, scipy y Pillow, que aquí no se
      # importan y suman minutos de descarga por nada.
      - name: Instalar dependencias del scraping
        run: |
          python -m pip install --upgrade pip
          python -m pip install aiohttp beautifulsoup4 lxml cloudscraper curl_cffi python-dotenv

      # Dice si la clave del relay está guardada como secreto, como variable, o
      # en ninguna de las dos. Sin esto, «la clave no coincide» en el log del
      # script no distingue un error de la clave de un error de dónde se guardó,
      # y las dos cosas se arreglan en sitios distintos de la pantalla.
      - name: Comprobar dónde está la clave del relay
        run: |
          echo "DPM_RELAY_SECRET como secreto: ${{ secrets.DPM_RELAY_SECRET != '' }}"
          echo "DPM_RELAY_SECRET como variable: ${{ vars.DPM_RELAY_SECRET != '' }}"

      - name: Refrescar rosters y publicar el censo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # `github.repository` y no el valor por defecto de `config.py`: así
          # funciona igual si algún día el repo se llama de otra forma.
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_RAMA_ESTADO: estado
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
          # La URL no es secreta (sin clave no responde nada). La clave sí, y por
          # eso se lee de un secreto: el repo es público y escrita aquí la vería
          # cualquiera. Si el secreto no existe, la variable llega vacía, el
          # relay contesta `forbidden` y el script sigue por el camino de
          # siempre — no se rompe nada, solo se pierde la ventaja.
          DPM_RELAY_URL: https://jeta-dpm-relay.jeta-dpm-relay.workers.dev
          # Se acepta el secreto **o** la variable. En la pantalla de GitHub las
          # dos pestañas están una al lado de la otra («Secrets» y «Variables») y
          # es fácil crear la entrada en la que no es: con `secrets.X` a secas, la
          # variable no llega y el Worker contesta `forbidden`, que parece un
          # problema del relay y es un problema de dónde se guardó la clave.
          DPM_RELAY_SECRET: ${{ secrets.DPM_RELAY_SECRET || vars.DPM_RELAY_SECRET }}
          # Sin esto los `print`/logs del script llegan al final de todo y no se
          # puede seguir la ejecución en vivo.
          PYTHONUNBUFFERED: '1'
        run: |
          echo "Intento ${{ matrix.intento }} de 3 (${{ github.event_name }})"
          if [ "${{ matrix.intento }}" != "1" ]; then
            # Los reintentos llevan el freno corto: si el intento anterior de
            # este mismo run publicó hace un momento, no se repite el scraping.
            ARGS="--si-mas-de-minutos 5"
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            # Vuelta del cron: solo trabaja si el censo tiene más de 50 min.
            #
            # El umbral tiene que ser **menor que el intervalo del cron** o el
            # cron no hace nada nunca: con 300 minutos y una vuelta cada 3 h, el
            # censo siempre tenía ~3 h, así que todas las vueltas se saltaban y
            # el workflow solo funcionaba cuando lo lanzaba un `push`. Estuvo así
            # desde el 01-11-2026 hasta que se vio en el log.
            ARGS="--si-mas-de-minutos 50"
          else
            # `push` o lanzado a mano: si alguien lo pide, se hace.
            ARGS="--forzar"
          fi
          if [ -n "${{ inputs.ligas }}" ]; then
            ARGS="$ARGS --ligas ${{ inputs.ligas }}"
          fi
          python scripts/refrescar_rosters.py $ARGS

      - name: Resumen
        if: always()
        run: |
          {
            echo "### Rosters (intento ${{ matrix.intento }})"
            if [ -f tracking/soloq/censo_compacto.json ]; then
              echo "- Censo compacto: $(du -h tracking/soloq/censo_compacto.json | cut -f1)"
            else
              echo "- **No se escribió el censo compacto.**"
            fi
            echo "- Resultado: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"
