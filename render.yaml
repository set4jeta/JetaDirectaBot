# Blueprint de Render para LoLProTrackr.
#
# IMPORTANTE — lee esto antes de tocar el fichero
# ----------------------------------------------
# El servicio YA EXISTE en Render. Render identifica cada servicio por su `name`,
# así que **el nombre tiene que ser exactamente el del servicio que ya hay**:
# `JetaDirectaBot`. Con cualquier otro, Render no lo reconocería y **crearía uno
# nuevo, duplicando el bot y la factura**.
#
# Este comentario decía antes que el nombre era `discord-bot` y que no se tocara.
# Era al revés: el servicio se llama `JetaDirectaBot` (comprobado contra la API de
# Render el 01-10-2026, id `srv-d25e71ili9vc73f6sbu0`). Seguir aquella nota tal
# cual habría creado el duplicado que decía evitar.
#
# Este fichero solo se usa si creas o sincronizas un **Blueprint**. Un servicio
# creado a mano (New → Web Service) lo ignora por completo.
#
# Y si lo sincronizas: Render **conserva** las variables de entorno que ya
# tengas puestas en el panel aunque no estén aquí, así que este fichero no
# puede borrarte nada. Aun así, aquí no se declara ningún valor para no
# sobrescribir lo que ya está configurado: las variables van en
# **Environment → Environment Variables** del panel (ver DESPLIEGUE.md §5).

services:
  - type: web
    name: JetaDirectaBot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    # `keep_alive.py` responde "Bot is alive!" en `/` y respeta `$PORT`.
    healthCheckPath: /
    # OJO: aquí dice `true` pero **el servicio real lo tiene apagado**
    # (`autoDeploy: "no"`, comprobado el 01-10-2026). Consecuencia práctica: un
    # `git push` **no despliega nada** y hay que lanzarlo a mano. Si se quiere que
    # el push despliegue solo —que es lo que promete esta línea— hay que
    # encenderlo en el panel: Settings → Build & Deploy → Auto-Deploy.
    autoDeploy: true

    # ----------------------------------------------------------------- #
    # Lo que NO se pone aquí y por qué
    # ----------------------------------------------------------------- #
    #
    # REGIÓN. Sería mejor `frankfurt` (el bot vive de la API europea y de
    # dpm.lol; Oregón añade ~120 ms por petición y el tracker hace miles), pero
    # **la región no se puede cambiar después de crear el servicio**. Ponerla
    # aquí solo tendría efecto en un servicio nuevo. Si algún día se crea uno,
    # añádela entonces:
    #   region: frankfurt
    #
    # VARIABLES DE ENTORNO. Render **no lee el `.env`** (está en `.gitignore` y
    # no existe en el repo). Las que necesita el bot se ponen a mano en
    # Environment → Environment Variables:
    #
    #   Obligatorias (sin ellas el bot sale con código 1 y lo dice en el log):
    #     RIOT_API_KEY     clave de producción (500 req/10s, 30000 req/10min)
    #     DISCORD_TOKEN    token del bot en el portal de desarrolladores
    #
    #   Recomendadas (salen en /help, /premium y en la web):
    #     BOT_NOMBRE       LoLProTrackr
    #     BOT_INVITE_URL   el botón "Añadir a Discord" de la web. Sin esto, sale
    #                      apagado: es el único enlace que convierte.
    #     BOT_WEB_URL      https://set4jeta.github.io/JetaDirectaBot/
    #     BOT_DONATE_URL   donaciones (Ko-fi/Patreon)
    #     BOT_SOPORTE_URL  servidor de soporte
    #
    #   Opcionales (tienen valor por defecto en `config.py`):
    #     LOL_API_KEY, FIREBASE_API_KEY, TWITCH_OAUTH_TOKEN, LOG_LEVEL...
    #     El listado completo y comentado está en `env.example`.
    #
    # Si en algún momento se crea un Blueprint desde cero, la forma de que
    # Render pida los dos secretos al crearlo es declararlos así (solo funciona
    # en la creación inicial; en una actualización Render los ignora):
    #   envVars:
    #     - key: RIOT_API_KEY
    #       sync: false
    #     - key: DISCORD_TOKEN
    #       sync: false
    #
    # ----------------------------------------------------------------- #
    # PLAN GRATUITO Y PERSISTENCIA (ver DESPLIEGUE.md §6 y §7)
    # ----------------------------------------------------------------- #
    #
    # El plan gratuito es 0,1 CPU / 512 MB y **se duerme a los 15 minutos sin
    # tráfico entrante**. Un bot de Discord no recibe tráfico entrante, así que
    # sin un monitor externo que lo despierte se duerme solo y deja de avisar.
    # Con UptimeRobot (o cron-job.org) haciendo una petición cada 5–10 minutos a
    # `https://<servicio>.onrender.com/` se mantiene despierto.
    #
    # ----------------------------------------------------------------- #
    # ANCHO DE BANDA — leer antes de dar el despliegue por bueno
    # ----------------------------------------------------------------- #
    #
    # El plan Hobby incluye **5 GB de ancho de banda de SALIDA al mes**, y al
    # agotarlos Render **suspende el workspace entero**: no es que frene el
    # servicio, es que el bot deja de estar online. Pasó el 29-09-2026 y estuvo
    # caído 3 días 40 minutos.
    #
    # La causa fue un cambio de Render: en abril de 2026 bajaron el ancho de
    # banda incluido **de 100 GB a 5 GB**. El bot no cambió, cambió el límite.
    #
    # Lo que lo agotaba eran los adjuntos de los avisos (foto del jugador, logo
    # del equipo y `.bat`), que se subían **una vez por destinatario**. Se
    # arregló pasando las dos imágenes a URL de dpm.lol —mismos píxeles, cero
    # bytes por Render— y dejando solo el `.bat`, que es único por partida.
    #
    # Y se añadió `utils/egress.py`: cuenta la salida del mes, la publica en
    # `/health` y avisa al 50 % y al 80 %. **Antes no había forma de verlo** y el
    # dueño se enteró con la cuenta ya suspendida.
    #
    # El detalle completo está en DESPLIEGUE.md §8.
    #
    # El sistema de ficheros es efímero: lo que el bot escriba se pierde en cada
    # despliegue, reinicio y también cada vez que se duerme. No se puede
    # arreglar con un disco persistente **tal cual**, porque el disco tapa la
    # carpeta donde se monta y el estado del bot vive dentro de
    # `tracking/soloq/`, junto al código. Para eso habría que mover antes esos
    # JSON a una carpeta aparte. Detalles y qué sobrevive hoy: DESPLIEGUE.md §7.
